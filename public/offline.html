<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MedFamily - Offline</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: "Plus Jakarta Sans", system-ui, sans-serif;
        background: #f4f7f4;
        color: #18302a;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        max-width: 520px;
        border: 1px solid #d6e0d9;
        border-radius: 24px;
        background: #fffdfa;
        padding: 28px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 1.75rem;
        line-height: 1.15;
      }

      p {
        margin: 0;
        color: #50635a;
        line-height: 1.6;
      }

      a {
        display: inline-block;
        margin-top: 20px;
        color: #2f715f;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>MedFamily can reopen the app shell, but private healthcare records and live care updates need a network connection.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
